name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  evaluation:
    name: Evaluation suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run evaluation suite
        id: evaluate
        run: python tests/evaluation/run_evaluation.py --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: tests/evaluation/report.json

      - name: Comment summary on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### O.R.B.I.T. evaluation suite\n\n';
            try {
              const report = JSON.parse(fs.readFileSync('tests/evaluation/report.json', 'utf8'));
              body += report.markdown_summary
                || '```json\n' + JSON.stringify(report, null, 2).slice(0, 60000) + '\n```';
            } catch (err) {
              body += 'The suite produced no report — it failed before writing one.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
